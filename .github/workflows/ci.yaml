name: ci

on:
  push:
  pull_request:

# Actions hands a job a permissive, write-scoped GITHUB_TOKEN when no
# `permissions` block is present. Nothing in this workflow writes anything back
# to GitHub, and the install jobs below run half a dozen `curl | sh` chains as
# part of what they are testing, so give that token nothing worth stealing. A
# job that ever genuinely needs more can ask for it locally.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The gate.
  #
  # Deliberately first, deliberately cheap (one chezmoi binary, no package
  # manager, no sudo, seconds rather than minutes) and deliberately blocking
  # everything else. It exists because a template that did not parse shipped to
  # a real laptop: every install job below died at `./install.sh: Permission
  # denied` before chezmoi was ever invoked, so `chezmoi init --apply` had never
  # once run in CI and nothing was checking the templates at all.
  #
  # Go templates are parsed in full but EXECUTED one branch at a time, so a
  # single render only proves the branches that one environment happens to take.
  # Two things fan the branches out — the OS, and the three shapes
  # .chezmoi.toml.tmpl derives from $CI / $CODESPACES — so cover both.
  # ---------------------------------------------------------------------------
  templates:
    name: templates (${{ matrix.os }}, ${{ matrix.shape }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shape: [local, ci, codespaces]
        include:
          # An interactive machine: the promptString branch is taken, so this is
          # the only shape that renders anything using the answers.
          - shape: local
            ci: ''
            codespaces: ''
            islocalenv: 'true'
          - shape: ci
            ci: 'true'
            codespaces: ''
            islocalenv: 'false'
          - shape: codespaces
            ci: ''
            codespaces: 'true'
            islocalenv: 'false'
    env:
      # Actions sets CI=true in every job, so the `local` shape has to blank it
      # out. .chezmoi.toml.tmpl asks `env "CI" | not | not`, ie; "set AND
      # non-empty", so an empty string reads there as absent. The assertion step
      # below fails loudly if that ever stops holding, rather than letting
      # `local` silently degrade into a second copy of `ci`.
      CI: ${{ matrix.ci }}
      CODESPACES: ${{ matrix.codespaces }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # checkout writes the job's GITHUB_TOKEN into .git/config by default,
          # where anything later in the job can read it back out. No job here
          # pushes, so don't leave it lying around.
          persist-credentials: false

      # install.sh was committed 100644, so `./install.sh` failed with
      # "Permission denied" in every job of the last hundred runs: a hundred
      # failures, zero successes, and a template parse error that shipped
      # anyway. The same bit is why Codespaces silently skipped the dotfiles
      # bootstrap — it runs the first EXECUTABLE candidate it finds and
      # otherwise moves on without a word.
      - name: install.sh must be executable
        run: test -x install.sh

      - name: install.sh must be valid POSIX sh
        run: sh -n install.sh

      - name: Install chezmoi (the binary only — nothing is applied)
        run: |
          set -eu
          sh -c "$(curl -fsSL https://chezmoi.io/get)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `init` without `--apply` only writes the config file, and that is
      # already a real test: it renders .chezmoi.toml.tmpl AND parses the TOML
      # that comes out, so a template that renders to malformed TOML fails here.
      #
      # The --promptString answers stand in for the promptStrings in
      # .chezmoi.toml.tmpl. Only the `local` shape reaches them. If a prompt is
      # added or renamed there it must be added here AND in the render step
      # below, or this job hangs waiting on a TTY it does not have.
      - name: Generate the config for this shape
        run: |
          set -eu
          chezmoi init --no-tty --source="$PWD" \
            --promptString "Enter your git email=ci@example.com" \
            --promptString "Enter your 1password email=ci@example.com" \
            --promptString "Enter email to display on lock screen=ci@example.com"

      - name: The shape under test must be the shape we asked for
        run: |
          set -eu
          actual="$(chezmoi execute-template '{{ .islocalenv }}')"
          if [ "$actual" != '${{ matrix.islocalenv }}' ]; then
            echo "::error::shape '${{ matrix.shape }}' should give islocalenv=${{ matrix.islocalenv }}, got '$actual'. The CI/CODESPACES override is not taking effect, so this leg is not testing what it claims to."
            exit 1
          fi

      # .chezmoiignore is always a template to chezmoi despite not being named
      # .tmpl, so it is listed explicitly alongside the glob. -z / -d '' because
      # one managed path contains a space.
      #
      # .chezmoi.toml.tmpl and everything else need OPPOSITE flags, which is why
      # this branches rather than passing one set to the whole loop:
      #
      #   --init executes stdin AS IF it were .chezmoi.toml.tmpl. That is what
      #   defines promptStringOnce, so the config template cannot render without
      #   it -- but it is a standalone mode that loads NO source state, so
      #   .chezmoitemplates/ is never registered and .chezmoidata.toml is never
      #   read. Every `{{ template "setup-helpers.sh.tmpl" . }}` is then "not
      #   defined" and every `.versions` lookup is a missing map key.
      #
      #   --source is what registers them, and is required because
      #   `chezmoi init --source` above does NOT persist sourceDir into the
      #   generated config, so a bare `chezmoi` on a runner looks in
      #   ~/.local/share/chezmoi, which does not exist there.
      #
      # Passing --init to everything is what kept this step red on all 233 runs
      # in this repo's history.
      #
      # Failures are collected rather than exited on. When that bug was found,
      # 15 of 23 templates were failing and this step reported exactly one,
      # because it stopped at the first -- which sent the investigation after a
      # single missing partial rather than the flag that broke all 15. The loop
      # body runs in a pipeline subshell, so the tally goes to a file.
      - name: Every template must parse and render
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/rendered"
          : > "$RUNNER_TEMP/render-failures"
          git ls-files -z '*.tmpl' .chezmoiignore | while IFS= read -r -d '' t; do
            dest="$RUNNER_TEMP/rendered/${t%.tmpl}"
            mkdir -p "$(dirname "$dest")"
            if [ "$t" = .chezmoi.toml.tmpl ]; then
              set -- --init \
                --promptString "Enter your git email=ci@example.com" \
                --promptString "Enter your 1password email=ci@example.com" \
                --promptString "Enter email to display on lock screen=ci@example.com"
            else
              set -- --source="$PWD"
            fi
            chezmoi execute-template --no-tty "$@" \
              < "$t" > "$dest" \
              || { echo "::error file=$t::template failed to render"; echo "$t" >> "$RUNNER_TEMP/render-failures"; }
          done
          if [ -s "$RUNNER_TEMP/render-failures" ]; then
            failed="$(wc -l < "$RUNNER_TEMP/render-failures" | tr -d ' ')"
            total="$(git ls-files '*.tmpl' .chezmoiignore | wc -l | tr -d ' ')"
            echo "::error::$failed of $total templates failed to render:"
            sed 's/^/  /' "$RUNNER_TEMP/render-failures"
            exit 1
          fi

      # THE check. A Go template does not interpolate inside a Go string
      # literal, so `{{ $x := "{{ .chezmoi.os }}" }}` passes the braces straight
      # through into the output. `bash -n` provably cannot catch that, because
      # `echo {{ .chezmoi.os }}` is perfectly valid bash — only grep notices.
      # This is the bug class that broke a real machine.
      - name: No template action may survive into rendered output
        run: |
          set -eu
          if grep -rn '{{' "$RUNNER_TEMP/rendered"; then
            echo "::error::a template action survived into rendered output (see above). Go templates do not interpolate inside string literals — build the string with printf instead."
            exit 1
          fi

      # Runs on macOS too, where /bin/bash is still 3.2, so this doubles as a
      # check that the scripts stay 3.2-compatible.
      #
      # `find`, not a glob: the setup scripts live under .chezmoiscripts/ and a
      # top-level `run_onchange_*.sh` glob silently matches nothing there — a
      # check that quietly stops checking is worse than no check. The `-print`
      # count below fails the step if the search ever comes back empty.
      #
      # .chezmoitemplates/setup-*.sh is included by those scripts rather than
      # run on its own, so it is a fragment and not valid bash in isolation;
      # it is covered by every script that pulls it in.
      - name: Rendered shell must be syntactically valid
        run: |
          set -eu
          scripts="$(find "$RUNNER_TEMP/rendered" -type f -name 'run_*.sh' -not -path '*/.chezmoitemplates/*' | sort)"
          if [ -z "$scripts" ]; then
            echo "::error::found no rendered setup scripts to syntax-check. The search path is wrong, so this job would pass without checking anything."
            exit 1
          fi
          : > "$RUNNER_TEMP/syntax-failures"
          echo "$scripts" | while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=${f#$RUNNER_TEMP/rendered/}.tmpl::rendered script is not valid bash"; echo "$f" >> "$RUNNER_TEMP/syntax-failures"; }
          done
          if [ -s "$RUNNER_TEMP/syntax-failures" ]; then
            echo "::error::$(wc -l < "$RUNNER_TEMP/syntax-failures" | tr -d ' ') rendered scripts are not valid bash (see above)"
            exit 1
          fi
          echo "syntax-checked:"
          echo "$scripts"

      # git reads this file for every command it runs, so a malformed one does
      # not degrade anything gracefully -- it takes out git itself, including
      # the git that would let you fix it. The render gate already produces the
      # file and until now checked nothing about it beyond the `{{` grep, which
      # cannot see an unterminated quote or a broken section header. git is
      # always present, so this costs nothing to run.
      - name: Rendered gitconfig must parse
        run: |
          set -eu
          git config --file "$RUNNER_TEMP/rendered/dot_gitconfig" --list > /dev/null

      # This repo is public and a leaked credential cannot be unpublished:
      # GitHub keeps orphaned commits reachable by SHA long after a force-push.
      # .chezmoiignore carries a deny-list for exactly this, and this turns the
      # comment above that list into something that fails when it stops being
      # true. Matches the managed SET, so it fires on `chezmoi add`-ing a
      # sensitive path even before anything lands in a commit.
      - name: No secret path may be managed
        run: |
          set -eu
          if chezmoi managed --source="$PWD" \
             | grep -nE '^(\.ssh|\.aws|\.gnupg|\.docker|\.config/(gh|op))(/|$)|^\.(netrc|npmrc|pypirc)$|\.(pem|key)$'; then
            echo "::error::a path on the .chezmoiignore secrets deny-list is in the managed set (see above). This repo is public — do not push this."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The install jobs.
  #
  # These are the first runs in this repo's history in which `./install.sh` is
  # executable, so they are the first in which `chezmoi init --apply` actually
  # executes rather than dying on the permission bit. Expect them to be slow,
  # and to surface real pre-existing breakage rather than the flat, meaningless
  # green they used to show.
  #
  # Environment matrix, now that Spin support has been removed from this repo:
  #
  #   macOS local | Linux local | Codespaces | CI
  #
  # Only the last two are reachable from here, and not even cleanly:
  # `test-codespaces` is NOT a clean Codespaces cell, because Actions sets
  # CI=true inside that container too. chezmoi therefore sees CODESPACES *and*
  # CI and takes the same `islocalenv = false` path as `test-ubuntu`. The two
  # local shapes are only ever covered by the render gate above, never by a
  # real apply.
  #
  # Each job runs two checks after ./install.sh. They are repeated rather than
  # shared because Actions does not support YAML anchors.
  #
  #   "Installed tooling must actually run" — every install step reports ✅ on
  #   the basis that its own commands exited 0; none check the result is
  #   usable. nvim is reached through a wrapper this repo writes, and when that
  #   wrapper pointed at a path that did not exist, nvim was unrunnable on every
  #   platform and $EDITOR silently fell back to vi. The `{{` grep only caught
  #   that because braces happened to leak — a merely WRONG interpolated path
  #   goes straight through it. git-lfs is here because the managed .gitconfig
  #   declares `required = true`, which is a hard failure and not a warning:
  #   without the binary, every clone of an LFS repo dies. The declaration and
  #   the installer live in different files and nothing checked they agree.
  #   zsh -n covers the one deployed file that breaks every future shell if it
  #   is malformed; the gate cannot do it, because zsh is not on the
  #   ubuntu-latest image until install_zsh puts it there.
  #
  #   node/npm/go are deliberately NOT checked: they reach PATH via `fnm env`
  #   and the deployed .zshrc, neither of which a plain Actions bash step
  #   sources, so checking them here would fail for the wrong reason.
  #
  #   "Provisioning must converge" — a setup script writing to a path chezmoi
  #   manages leaves the machine in a state the next apply undoes, silently and
  #   forever. Two commits already reason carefully about exactly this
  #   (git-lfs's ~/.gitconfig block, the volatile-file handling) and nothing
  #   tested that reasoning. -x scripts because run_after_fzf-binary.sh is a
  #   plain run_after_ script and is pending on every apply by design.
  # ---------------------------------------------------------------------------
  test-ubuntu:
    needs: templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: ./install.sh
      - name: Installed tooling must actually run
        run: |
          set -eu
          nvim --version | head -1
          zsh --version
          git lfs version
          zsh -n "$HOME/.zshrc"
          zsh -n "$HOME/.zsh_aliases"
      - name: Provisioning must converge
        run: |
          set -eu
          out="$("$HOME/.local/bin/chezmoi" status --source="$PWD" -x scripts)"
          if [ -n "$out" ]; then
            echo "$out"
            # "something drifted" is not actionable on its own -- the whole
            # question is WHAT was written and by which installer, and the
            # runner is gone by the time anyone reads this.
            echo "--- what changed ---"
            "$HOME/.local/bin/chezmoi" diff --source="$PWD" -x scripts || true
            echo "::error::a managed file differs from its target state after ./install.sh. Either a setup script wrote to a path chezmoi owns, or a managed file is volatile — either way the next apply will fight it."
            exit 1
          fi
      - name: chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'

  test-codespaces:
    needs: templates
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/vscode/devcontainers/base:ubuntu
      env:
        CODESPACES: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: ./install.sh
      - name: Installed tooling must actually run
        run: |
          set -eu
          nvim --version | head -1
          zsh --version
          git lfs version
          zsh -n "$HOME/.zshrc"
          zsh -n "$HOME/.zsh_aliases"
      - name: Provisioning must converge
        run: |
          set -eu
          out="$("$HOME/.local/bin/chezmoi" status --source="$PWD" -x scripts)"
          if [ -n "$out" ]; then
            echo "$out"
            # "something drifted" is not actionable on its own -- the whole
            # question is WHAT was written and by which installer, and the
            # runner is gone by the time anyone reads this.
            echo "--- what changed ---"
            "$HOME/.local/bin/chezmoi" diff --source="$PWD" -x scripts || true
            echo "::error::a managed file differs from its target state after ./install.sh. Either a setup script wrote to a path chezmoi owns, or a managed file is volatile — either way the next apply will fight it."
            exit 1
          fi
      - name: chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'

  test-macos:
    needs: templates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: ./install.sh
      - name: Installed tooling must actually run
        run: |
          set -eu
          nvim --version | head -1
          zsh --version
          git lfs version
          zsh -n "$HOME/.zshrc"
          zsh -n "$HOME/.zsh_aliases"
      - name: Provisioning must converge
        run: |
          set -eu
          out="$("$HOME/.local/bin/chezmoi" status --source="$PWD" -x scripts)"
          if [ -n "$out" ]; then
            echo "$out"
            # "something drifted" is not actionable on its own -- the whole
            # question is WHAT was written and by which installer, and the
            # runner is gone by the time anyone reads this.
            echo "--- what changed ---"
            "$HOME/.local/bin/chezmoi" diff --source="$PWD" -x scripts || true
            echo "::error::a managed file differs from its target state after ./install.sh. Either a setup script wrote to a path chezmoi owns, or a managed file is volatile — either way the next apply will fight it."
            exit 1
          fi
      - name: chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'
