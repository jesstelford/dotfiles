# Pinned versions of everything the setup scripts download by hand, and the
# SHA-256 of the exact asset each pin resolves to.
#
# These live here rather than inline so that bumping one tool is a one-line
# change in one place, and so the setup script can later be split per-tool
# without the versions being scattered across the pieces. The digest lives
# beside the version it belongs to for the same reason: a version bump and its
# digest are then one contiguous edit rather than two edits in two files that
# can drift apart.
#
# Only tools we pin ourselves are listed. Things installed via brew/apt, or
# resolved at run time (Go reads go.dev/VERSION, Discord/Brave use "latest"
# endpoints), deliberately have no entry — they are not pinned.
#
# Refreshing a digest after a version bump, without downloading anything:
#
#   curl -s https://api.github.com/repos/<owner>/<repo>/releases/tags/<tag> \
#     | grep -E '"(name|digest)"'
#
# GitHub publishes a `digest` field for assets uploaded from mid-2025 onwards.
# For older assets, and for the handful of downloads not hosted on GitHub, the
# digest was captured by fetching the pinned URL and hashing it (2026-07-28).
# That is trust-on-first-use — it attests that the bytes have not changed since,
# not that they were good to begin with — which is still strictly better than
# the nothing that was here before.

[versions]

# https://github.com/neovim/neovim/releases
nvim = "0.12.4"

# Node major version, used as "v<major>" by fnm
node = "24"

# https://roamresearch.com desktop app
roam = "0.0.14"

# https://github.com/sharkdp/bat/releases
bat = "0.26.1"

# https://github.com/dandavison/delta/releases
delta = "0.19.2"

# https://github.com/LuaLS/lua-language-server/releases
lua_language_server = "3.18.2"

# https://www.mongodb.com — the apt repo and signing key are keyed on the
# release series. No exact patch pin: holding a package at one patch release is
# what let the previous 4.4.5 pin rot unnoticed for four years.
mongodb = "8.0"

# https://github.com/dbeaver/dbeaver/releases — DBeaver cuts a release roughly
# fortnightly, so this pin will go stale; it is pinned anyway because that is
# what makes the digest below mean anything.
dbeaver = "26.1.3"

# Playwright is used to script the PICO-8 download; pinned to a "~" range
playwright = "1.62.0"

# https://www.cockos.com/licecap/ — the download URL squashes the version into
# the filename with no separators, so 1.32 becomes "132".
licecap = "132"

# https://github.com/zsa/wally/releases — the release tag is "<version>-linux"
wally = "2.1.3"

# https://github.com/FiloSottile/mkcert/releases
mkcert = "1.4.4"

# https://github.com/googlefonts/noto-emoji/releases — pinned to a tag rather
# than tracking `main`, because an unpinned raw.github URL cannot be
# checksummed even in principle.
noto_emoji = "v2.051"

# https://github.com/fontforge/fontforge — pinned to a commit rather than a tag,
# because the newest tag is the broken one. 20251009's TTF writer emits a bogus
# `hmtx` for monospaced fonts: hhea's numberOfHMetrics is 4 with a trailing
# advance of 0, and per the OpenType spec every glyph from index 4 on inherits
# that last advance. So every glyph ends up 0 wide. Nothing errors — the patched
# font installs cleanly and then renders as one unreadable column in Ghostty,
# which derives its grid cell width from that advance.
#
# aedb8f2e is upstream's fix ("tottf: Fix hmtx table (all widths zero) for
# monospaced fonts", PR 5702) and already contains 9d119ca0 (PR 5698) that it
# depends on.
#
# TODO: drop this pin, the fontforge-hmtxfix formula and its tap once a
# fontforge release after 20251009 exists; install_fontforge goes back to plain
# `brew install fontforge`. Keep verify_font_advances either way.
#
# No digest entry: a git revision is already a hash of the tree it names.
fontforge_hmtxfix = "aedb8f2e95ddba99e8cb6446f082a356e2c2625b"

# Minimum acceptable nerd-fonts versions, asserted at run time rather than
# pinned, because the checkout deliberately tracks upstream. Both numbers are
# read out of the `font-patcher` script itself (`script_version` and `version`):
# the clone is shallow and carries no tags, so `git describe` has nothing to go
# on — which is also why font-patcher's own version banner reports the fallback.
font_patcher_min = "4.26.0"
nerd_fonts_min = "3.4.0"

# SHA-256 of every pinned download above. Per-arch where upstream publishes a
# per-arch asset, so the script can `index .digests.<tool> $arch`.
[digests]

# Roam Research is a single universal .dmg on macOS and an amd64-only .deb on
# Linux, so these are scalars rather than per-arch tables.
roam_dmg = "e2e94fc056e3fa187b8f2e6bce6eb40253b7e2c0bea64730199667ab2c183e52"
roam_deb = "8c1c9a88fe08b75f677e3a0938f5a76f438a183e4696fdf9d093e1bf658cb684"

licecap = "115c40eb710085969a72a24d5d84ae2c05260192cc68a22e73e99e148c6638da"

# Upstream ships a single unlabelled x86_64 `wally` asset for this release, so
# there is no arm64 build to pin a digest for.
wally_amd64 = "a30c974c2fd544975e48f7f2ac99a21f936fa3e0803afeeb1096826a79afdbde"

noto_emoji = "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b"

# Digests published by GitHub for the Neovim release assets.
[digests.nvim_macos]
amd64 = "03fe16f8dd9f1e9eaf52d5e294913a39917b9e2faea30d7fb0fb385fbd36fe59"
arm64 = "51ab83afa66d663627c2ab1be43209b0f4e81360d4598b53efaa4d8195f24c89"

[digests.nvim_linux]
amd64 = "cdbd8b533b500e272021e1021eafcfe28a77fc4d769465a8f1a48a34002383a7"
