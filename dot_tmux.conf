# Ensure we have the right colors set. This is the terminfo tmux advertises to
# programs running *inside* it, not the one the outer terminal uses; truecolor
# and undercurl are switched on separately via `terminal-features` at the bottom
# of this file, which Ghostty supports.
#
# tmux-256color is the entry that actually describes tmux; xterm-256color
# describes xterm and claims capabilities tmux does not implement. It lives in
# ncurses-term rather than ncurses-base on some distros, and tmux refuses to
# start at all when default-terminal names an entry it cannot find, so fall back
# to screen-256color when it is missing (Codespaces, minimal CI images).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# default-shell is deliberately unset. The setup script chsh's this account to
# the Homebrew zsh, so hardcoding /bin/zsh here would run panes under the older
# system zsh while the login shell is a different binary. Unset, tmux uses $SHELL.

# scroll-back history
set -g history-limit 100000

# TODO: What does this do?
#set-option -g set-titles on
# Don't rename windows automatically, so we can use <leader>, to name them
# manually. See:
# https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf#stop-renaming-windows-automatically
set-option -g allow-rename off

# Allow clicking between windows / panes
set -g mouse on

# Start windows at 1
set -g base-index 1

# Close a window in the middle and the ones after it slide down, so the numbers
# stay contiguous and keep matching the position in the status bar.
set -g renumber-windows on

# Start panes at 1 (note: This is a per-window setting, hence the setw)
setw -g pane-base-index 1

# Ensure we don't pause for too long when chroding key presses
# See: https://unix.stackexchange.com/a/608179/94874
set -sg escape-time 10

# In copy mode, use vi-style navigation instead of emacs
# (wtf is "copy mode"?)
set -g mode-keys vi

# Ensure nested tmux sessions can paste to the OS clipboard
# See: https://github.com/tmux/tmux/wiki/Clipboard
#
# CAVEAT: this only does anything when tmux believes the *outer* terminal has the
# `clipboard` feature (terminfo Ms). `.zsh_aliases` currently forces
# TERM=screen-256color-bce for tmux, and that entry has no Ms -- measured client
# features under it are bpaste,focus,RGB,title,usstyle, i.e. no clipboard, no
# ccolour, no cstyle. Under the real xterm-ghostty they are
# bpaste,ccolour,clipboard,cstyle,focus,RGB,title,usstyle. So this line is inert
# in practice until that alias is narrowed to the case it exists for (an outer
# TERM the remote host has no terminfo entry for). RGB/usstyle are unaffected --
# they are forced below by a `*` glob that matches any TERM.
set -s set-clipboard on

# Let a program in a pane hand an escape sequence straight through to the outer
# terminal (DCS tmux; ... ST). Needed for image protocols and for anything that
# talks to the terminal in a dialect tmux does not itself parse.
set -g allow-passthrough on

# Use Ctrl-Space as prefix
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Make tmux look a bit nicer
set-option -g status-position top
set -g status-justify left
set -g window-status-style "bg=colour238,fg=colour102"
set -g window-status-current-style "bg=colour236,fg=colour188"
set -g window-status-separator '#[bg=colour238]#[fg=colour243]❘'
set -g status-left '#[bg=colour238] '
set -g status-right '#[bg=colour238] '
set -g window-status-format " #W "
set -g window-status-current-format " #W "


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
#
# KNOWN DATED: this is the pre-2022 vim-tmux-navigator recipe. It shells out to
# ps on every C-h/j/k/l, and it cannot see vim running on the far side of an ssh
# session (see the C-w FIXME below). Upstream now recommends matching on
# `#{pane_current_command}` or having vim set a @is_vim user option. Left as-is
# on purpose: it works locally, and swapping it is a behaviour change that wants
# testing at a keyboard, not a drive-by edit.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# ==== Key bindings ====
# -T means; which "key table" is this binding for?
# The "root" key table is "all key presses"
# The "prefix" key table is "key presses after the prefix is pressed"
# The "copy-mode-vi" key table is "keys pressed while in copy-mode"
# NOTE: all the ^x keys are so I can just hold "Ctrl-Space" (or just Ctrl) and
# tap the relevant command, means I can trigger things on keydown rather than
# key up.
# -r means "May repeat"

# Use Ctrl-h/j/k/l to move between panes
# If the current pane has vim open, just pass the key press through normally and
# let vim handle it (so we can move between vim splits)
bind-key -T root 'C-h' if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -T root 'C-j' if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -T root 'C-k' if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -T root 'C-l' if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -T root 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# As an escape hatch: Allow <prefix>h/j/k/l to move between tmux panes
bind-key -T prefix -r  'h' select-pane -L
bind-key -T prefix -r '^h' select-pane -L
bind-key -T prefix -r  'j' select-pane -D
bind-key -T prefix -r '^j' select-pane -D
bind-key -T prefix -r  'k' select-pane -U
bind-key -T prefix -r '^k' select-pane -U
bind-key -T prefix -r  'l' select-pane -R
# ...except <prefix>^l, which is the vim-tmux-navigator recipe for getting
# clear-screen back. The root C-l above eats it whenever the pane is not running
# vim, and there is no other way to reach the shell's Ctrl-L.
bind-key -T prefix '^l' send-keys 'C-l'

# Reload this config file with <prefix>r
bind-key -T prefix  'r' source-file ~/.tmux.conf
bind-key -T prefix '^r' source-file ~/.tmux.conf

# TODO: What are these doing?
#bind-key -T prefix  'S' command-prompt -p ssh: "new-window -n %1 'ssh %1'"
#bind-key -T prefix '^S' command-prompt -p ssh: "new-window -n %1 'ssh %1'"

# More sane splitting commands: The \ key for horizontal split, - for vertical.
bind-key -T prefix  '\' split-window -h -c "#{pane_current_path}"
bind-key -T prefix '^\' split-window -h -c "#{pane_current_path}"
bind-key -T prefix  '-' split-window -v -c "#{pane_current_path}"
# Holding ctrl and pressing - sends ^_ for some reason
bind-key -T prefix '^_' split-window -v -c "#{pane_current_path}"

# Looking for where we execute next-window or previous-window? We just rely on
# the default <leader>n / <leader>p, but instead of typing that every time, we
# setup our terminal emulator (Ghostty) to convert the keypresses of
# Cmd+Alt+Right / Cmd+Alt+Left to the correct code tmux understands.
# See the `keybind` lines in ~/.config/ghostty/config.

# Create a new tab (actually a new tmux "window").
#
# This is in the prefix table, not root. A root binding intercepts Ctrl-T before
# the shell ever sees it, which meant fzf's Ctrl-T file widget never fired inside
# tmux -- i.e. never. Only ^t is bound, not plain 't': <prefix>t is tmux's clock,
# and that is a real default worth keeping.
bind-key -T prefix '^t' new-window -c "#{pane_current_path}" -n "new tab"

# There is deliberately no `unbind C-x` or `unbind C-6` here. tmux binds neither
# by default, and an unqualified `unbind` targets the prefix table, not root --
# so both were no-ops that read like protections.

# Closing panes (and tabs) is done with ctrl-w.
# FIXME: This doesn't work when using vim over ssh, so I keep accidentally
# closing panes when I mean to switch vim windows.
#bind-key -T root ^w if-shell "$is_vim" "send-keys C-w"  "kill-pane"

# Use v/V to trigger selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line

# Use y to yank current selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 24-bit colour and coloured undercurl.
#
# terminal-features is the modern way to say this: `RGB` and `usstyle` are named
# features tmux knows how to translate, and `usstyle` expands to exactly the
# Smulx/Setulc capability strings that used to be hand-written here. The old
# entries were also split between `-ga` (session) and `-sa` (server) on the same
# server-level option, which only worked by accident.
set -as terminal-features ",*:RGB:usstyle"

# Enable focus events so lazyvim can use `autoread`
set -g focus-events on
